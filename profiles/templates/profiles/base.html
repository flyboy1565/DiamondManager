<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DiamondManager Hub{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">💎</span>
            <a href="#" class="text-xl font-bold tracking-wider text-emerald-400">DiamondManager</a>
        </div>
        <div class="space-x-4 text-sm font-medium">
            {% if user.is_authenticated %}
                <span class="text-slate-400">Welcome, {{ user.username }}</span>
                <a href="/admin/logout/" class="text-rose-400 hover:text-rose-300 transition">Sign Out</a>
            {% else %}
                <a href="#" class="text-slate-300 hover:text-white transition">Support</a>
            {% endif %}
        </div>
    </nav>

    {% if messages %}
    <div class="max-w-4xl mx-auto w-full mt-4 px-4">
        {% for message in messages %}
        <div class="p-4 rounded-lg text-sm border {% if message.tags == 'success' %}bg-emerald-950/50 border-emerald-500 text-emerald-300{% else %}bg-rose-950/50 border-rose-500 text-rose-300{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="flex-grow flex items-center justify-center p-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-950 text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        &copy; 2026 DiamondManager. Built for the dugout.
    </footer>

</body>
</html>
