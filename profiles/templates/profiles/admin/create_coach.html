{% extends 'profiles/base.html' %}

{% block title %}Add Coach - DiamondManager{% endblock %}

{% block content %}
<div class="w-full max-w-2xl">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-xl">
    <h1 class="text-2xl font-bold text-white mb-4">Add Coach to {{ team.name }}</h1>
    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-2">User</label>
        {{ form.user }}
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-2">Role</label>
        {{ form.role }}
      </div>
      <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded">Add Coach</button>
    </form>
  </div>
</div>
{% endblock %}
