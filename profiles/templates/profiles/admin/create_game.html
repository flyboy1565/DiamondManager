{% extends 'profiles/base.html' %}

{% block title %}Create Game - DiamondManager{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-white mb-2">Create Game</h1>
    <p class="text-slate-400 mb-6">Schedule a game for {{ team.name }}.</p>

    <div class="bg-slate-800 border border-slate-700 rounded-lg p-6">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Date & Time</label>
                {{ form.date_time }}
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Location</label>
                {{ form.location }}
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Is Home Game?</label>
                {{ form.is_home }}
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Opponent Name</label>
                {{ form.opponent_name }}
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition">Create Game</button>
        </form>
    </div>
</div>
{% endblock %}
