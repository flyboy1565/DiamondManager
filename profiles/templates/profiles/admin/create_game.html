{% extends 'profiles/base.html' %}

{% block title %}Add Game - DiamondManager{% endblock %}

{% block content %}
<div class="w-full max-w-2xl">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-xl">
    <h1 class="text-2xl font-bold text-white mb-4">Create Game for {{ team.name }}</h1>
    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-2">Date & Time</label>
        {{ form.date_time }}
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-2">Location</label>
        {{ form.location }}
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-2">Is Home Game?</label>
        {{ form.is_home }}
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-2">Opponent Name (optional)</label>
        {{ form.opponent_name }}
      </div>
      <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded">Create Game</button>
    </form>
  </div>
</div>
{% endblock %}
